<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hochzeit Vanessa & Martin</title>
    
    <!-- Fallback-Weiterleitung nach 10 Sekunden -->
    <!-- WICHTIG: Ersetze "https://deine-zielseite.de" durch deine echte URL -->
    <meta http-equiv="refresh" content="10; url=https://withjoy.com/vanessa-und-martin">
    
    <style>
        /* Grundlegendes Styling für 100% Höhe */
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            
            /* Mobile-freundliche Hintergrund-Einstellungen (ohne 'fixed') */
            background-color: #f4f4f4;
            background-image: url('watermarked_img_3741654503065349665.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        /* Responsive Container */
        .container {
            width: 85%; /* Lässt auf dem Handy Rand für das Hintergrundbild */
            max-width: 500px;
            padding: 40px 20px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            
            /* Milchglas-Effekt */
            background-color: rgba(255, 255, 255, 0.85); /* 85% weiß */
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            
            /* Blur-Effekt für moderne Browser und Safari */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* Styling für die Namen */
        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            color: #333333;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-size: 1.6em; /* Etwas kleiner für Mobile */
        }

        .redirect-text {
            font-size: 1.05em;
            margin-bottom: 30px;
            color: #444444;
            letter-spacing: 0.5px;
            line-height: 1.5;
        }

        /* Styling des manuellen Buttons */
        .btn-redirect {
            display: inline-block;
            padding: 12px 30px;
            font-size: 1.05em;
            text-decoration: none;
            color: #333333;
            background-color: transparent;
            border: 2px solid #333333;
            border-radius: 50px;
            transition: all 0.3s ease;
            cursor: pointer;
            width: 80%; /* Button nimmt auf Mobile fast die Container-Breite ein */
            max-width: 250px;
            box-sizing: border-box;
        }

        .btn-redirect:hover {
            /* Das Eukalyptus-Grün für den Hover-Effekt */
            background-color: #7A9079; 
            color: #ffffff;
            border-color: #7A9079;
        }

        /* Lade-Indikator */
        .spinner {
            margin-top: 30px;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(122, 144, 121, 0.3);
            border-radius: 50%;
            border-top-color: #7A9079;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Spezielle Anpassungen für sehr kleine Bildschirme (Smartphones hochkant) */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.4em;
                letter-spacing: 1px;
            }
            .container {
                width: 88%;
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Die Namen der beiden -->
        <h1>Hochzeit Vanessa & Martin</h1>

        <div class="redirect-text">
            Du wirst in <strong id="countdown">10</strong> Sekunden zu unserer Hochzeitsseite weitergeleitet...
        </div>

        <!-- Manueller Link, falls jemand nicht warten möchte -->
        <!-- WICHTIG: Ersetze das href-Attribut durch deine echte URL -->
        <a href="https://withjoy.com/vanessa-und-martin" class="btn-redirect" id="manual-link">
            Direkt zur Seite
        </a>

        <div class="spinner"></div>
    </div>

    <script>
        // JavaScript für den visuellen Countdown und die Weiterleitung
        let timeLeft = 10;
        const countdownElement = document.getElementById('countdown');
        
        // HIER DEINE ECHTE ZIEL-URL EINTRAGEN
        const targetUrl = "https://withjoy.com/vanessa-und-martin"; 
        
        // Stellt sicher, dass auch der Button auf die richtige URL im Script zeigt
        document.getElementById('manual-link').href = targetUrl;

        const timer = setInterval(() => {
            timeLeft--;
            countdownElement.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = targetUrl;
            }
        }, 1000);
    </script>

</body>
</html>
